auto:T("Auto Loan Calculator","Estimate a monthly car payment after sales tax, down payment and trade-in.",{f:[["p","Vehicle price",35000,"$"],["d","Down payment",5000,"$"],["tr","Trade-in value",0,"$"],["s","Sales tax",7,"%"],["r","Interest rate",6.9,"%"],["n","Loan term",60,"months"]],run:v=>{const L=Math.max(0,v.p*(1+v.s/100)-v.d-v.tr),p=pmt(L,v.r/1200,v.n);return{main:["Monthly Payment",m(p)],rows:[["Loan amount (with tax)",m(L)],["Total of payments",m(p*v.n)],["Total interest",m(p*v.n-L)],["Total cost incl. down payment & trade-in",m(p*v.n+v.d+v.tr)]],note:"Sales tax is applied to the full price. Some states reduce tax for a trade-in."}}}),
interest:T("Interest Calculator","Find out how a balance grows with compound interest and regular deposits.",{f:[["P","Starting balance",10000,"$"],["r","Interest rate",5,"%"],["y","Time",10,"years"],["c","Compounding",12,"sel",[[365,"Daily"],[12,"Monthly"],[4,"Quarterly"],[1,"Annually"]]],["d","Monthly deposit",0,"$"]],run:v=>{const i=Math.pow(1+v.r/100/v.c,v.c/12)-1,n=v.y*12,B=k=>fv(v.P,v.d,i,k),rows=[];for(let y=1;y<=Math.ceil(v.y);y++){const k=Math.min(y*12,n);rows.push([y,m0(v.P+v.d*k),m0(B(k)-v.P-v.d*k),m0(B(k))])}return{main:["Ending Balance",m(B(n))],rows:[["Total deposits",m(v.P+v.d*n)],["Total interest earned",m(B(n)-v.P-v.d*n)]],table:{h:["Year","Deposited","Interest earned","Balance"],r:rows}}}}),
payment:T("Payment Calculator","See how long it takes to pay off a balance with a fixed monthly payment.",{f:[["a","Loan balance",15000,"$"],["r","Interest rate",6,"%"],["p","Monthly payment",400,"$"]],run:v=>{const i=v.r/1200;if(v.p<=v.a*i||v.p<=0)return{err:"The payment must be larger than the monthly interest ("+m(v.a*i)+")."};const n=i?-Math.log(1-i*v.a/v.p)/Math.log(1+i):v.a/v.p,N=Math.ceil(n);return{main:["Time to pay off",yrs(n)],rows:[["Number of payments",N],["Total of payments",m(v.p*n)],["Total interest",m(v.p*n-v.a)]]}}}),

investment:T("Investment Calculator","Project the growth of an investment with monthly contributions that can rise each year.",{f:[["P","Starting amount",10000,"$"],["d","Monthly contribution",500,"$"],["g","Yearly contribution increase",0,"%"],["r","Annual return",7,"%"],["y","Time",20,"years"]],run:v=>{const i=v.r/1200;let b=v.P,c=v.P,rows=[];for(let k=0;k<v.y*12;k++){b=b*(1+i)+v.d*Math.pow(1+v.g/100,Math.floor(k/12));c+=v.d*Math.pow(1+v.g/100,Math.floor(k/12));if((k+1)%12==0||k==v.y*12-1)rows.push([Math.ceil((k+1)/12),m0(c),m0(b-c),m0(b)])}return{main:["Ending Balance",m(b)],rows:[["Total contributed",m(c)],["Total earnings",m(b-c)]],table:{h:["Year","Contributed","Earnings","Balance"],r:rows}}}}),
currency:T("Currency Calculator","Convert an amount using an exchange rate you enter.",{f:[["a","Amount",100,""],["f","From (code)","USD","txt"],["t","To (code)","EUR","txt"],["x","Exchange rate (1 from = ? to)",0.92,""]],run:v=>({main:["Converted amount",v.a*v.x==0?"0":(v.a*v.x).toLocaleString("en-US",{maximumFractionDigits:4})+" "+v.t.toUpperCase()],rows:[["Rate",1+" "+v.f.toUpperCase()+" = "+v.x+" "+v.t.toUpperCase()],["Reverse rate",1+" "+v.t.toUpperCase()+" = "+(v.x?(1/v.x).toFixed(6):0)+" "+v.f.toUpperCase()]],note:"This site does not fetch live rates. Look up today's rate with your bank or a currency service and type it in."})}),
inflation:T("Inflation Calculator","See how rising prices change what money can buy over time.",{f:[["a","Amount",1000,"$"],["r","Average yearly inflation",3,"%"],["y","Years",10,"years"]],run:v=>{const k=Math.pow(1+v.r/100,v.y);return{main:["Cost in "+v.y+" years",m(v.a*k)],rows:[["Today's "+m0(v.a)+" will buy only about",m(v.a/k)+" worth of goods"],["Total price increase",((k-1)*100).toFixed(1)+"%"]]}}}),
income:T("Income Tax Calculator","Estimate U.S. federal income tax for 2026 using the standard deduction.",{f:[["s","Filing status","s","sel",[["s","Single"],["j","Married filing jointly"]]],["g","Yearly income",85000,"$"],["p","Pre-tax deductions (401k etc.)",0,"$"]],run:v=>{const J=v.s=="j",sd=J?32200:16100,br=J?[24800,100800,211400,403550,512450,768700]:[12400,50400,105700,201775,256225,640600],rt=[.1,.12,.22,.24,.32,.35,.37],ti=Math.max(0,v.g-v.p-sd);let tax=0,lo=0,mg=.1;br.concat([1e12]).forEach((hi,k)=>{if(ti>lo){tax+=(Math.min(ti,hi)-lo)*rt[k];mg=rt[k]}lo=hi});return{main:["Estimated federal tax",m(tax)],rows:[["Standard deduction",m(sd)],["Taxable income",m(ti)],["Marginal rate",(mg*100)+"%"],["Effective rate (of income)",(v.g?tax/v.g*100:0).toFixed(1)+"%"],["Income after federal tax",m(v.g-tax)]],note:"2026 federal brackets, single and married filing jointly only. Does not include Social Security, Medicare, state tax or credits. Not tax advice."}}}),
salary:T("Salary Calculator","Convert pay between hourly, weekly, monthly and yearly amounts.",{f:[["a","Pay amount",25,"$"],["p","Pay period",1,"sel",[[1,"Hourly"],[2,"Weekly"],[3,"Bi-weekly"],[4,"Monthly"],[5,"Annual"]]],["h","Hours per week",40,""],["w","Weeks per year",52,""]],run:v=>{const hw=v.h,w=v.w,A=[0,v.a*hw*w,v.a*w,v.a*w/2,v.a*12,v.a][v.p],o=[["Hourly",A/(hw*w)],["Daily",A/(w*5)],["Weekly",A/w],["Bi-weekly",A/(w/2)],["Semi-monthly",A/24],["Monthly",A/12],["Quarterly",A/4],["Annual",A]];return{main:["Annual salary",m(A)],rows:o.map(x=>[x[0],m(x[1])])}}})
};

const z=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()),dm=n=>{const d=new Date();d.setDate(d.getDate()+n);return ds(d)};

function sci(e,deg){if(!/^[0-9a-z+\-*/().,\s^π%]*$/i.test(e))throw 0;const ok="sin cos tan asin acos atan sqrt log ln exp abs pi e floor ceil round".split(" ");(e.match(/[a-z]+/gi)||[]).forEach(w=>{if(!ok.includes(w.toLowerCase()))throw 0});const k=deg?Math.PI/180:1,F={sin:x=>Math.sin(x*k),cos:x=>Math.cos(x*k),tan:x=>Math.tan(x*k),asin:x=>Math.asin(x)/k,acos:x=>Math.acos(x)/k,atan:x=>Math.atan(x)/k,sqrt:Math.sqrt,log:Math.log10,ln:Math.log,exp:Math.exp,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,round:Math.round};return Function("F","pi","e",'"use strict";const{'+Object.keys(F)+"}=F;return ("+e.replace(/π/g,"pi").replace(/\^/g,"**").replace(/%/g,"/100")+")")(F,Math.PI,Math.E)}
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
Object.assign(D,{
calorie:T("Calorie Calculator","Estimate how many calories you burn each day and what to eat to lose or gain weight.",{c:"fit",f:[...CF,["act","Activity level",1.375,"sel",[[1.2,"Sedentary"],[1.375,"Light (1-3 days/week)"],[1.55,"Moderate (3-5 days)"],[1.725,"Very active (6-7 days)"],[1.9,"Extra active"]]]],run:v=>{const t=bmr(v)*v.act;return{main:["Maintain weight",Math.round(t)+" cal/day"],rows:[["BMR (at rest)",Math.round(bmr(v))+" cal/day"],["Lose about 1 lb/week",Math.round(t-500)+" cal/day"],["Gain about 1 lb/week",Math.round(t+500)+" cal/day"]],note:"Uses the Mifflin-St Jeor equation. Very low calorie plans should be supervised by a doctor."}}}),
bmr:T("BMR Calculator","Calculate the calories your body burns at rest.",{c:"fit",f:CF,run:v=>{const k=kg(v.w),c=cmv(v.h),hb=v.sx=="m"?88.362+13.397*k+4.799*c-5.677*v.a:447.593+9.247*k+3.098*c-4.33*v.a;return{main:["BMR",Math.round(bmr(v))+" cal/day"],rows:[["Mifflin-St Jeor",Math.round(bmr(v))+" cal/day"],["Revised Harris-Benedict",Math.round(hb)+" cal/day"]]}}}),
bodyfat:T("Body Fat Calculator","Estimate body fat percentage with the U.S. Navy tape-measure method.",{c:"fit",f:[SX,["h","Height",70,"inches"],["n","Neck",15,"inches"],["wa","Waist (at navel)",34,"inches"],["hp","Hip (women only)",38,"inches"],["w","Weight",170,"pounds"]],run:v=>{const M=v.sx=="m",x=M?v.wa-v.n:v.wa+v.hp-v.n;if(x<=0||v.h<=0)return{err:"Check your measurements. Waist must be larger than neck."};const L=Math.log10,bf=M?86.01*L(v.wa-v.n)-70.041*L(v.h)+36.76:163.205*L(x)-97.684*L(v.h)-78.387,T=M?[[6,"Essential fat"],[14,"Athlete"],[18,"Fitness"],[25,"Average"],[999,"Obese"]]:[[14,"Essential fat"],[21,"Athlete"],[25,"Fitness"],[32,"Average"],[999,"Obese"]],cat=T.find(t=>bf<t[0])[1],fm=v.w*bf/100;return{main:["Body fat",bf.toFixed(1)+"%"],rows:[["Category",cat],["Fat mass",fm.toFixed(1)+" lb"],["Lean mass",(v.w-fm).toFixed(1)+" lb"]],note:"Tape-measure estimates can be off by several points."}}}),
macro:T("Macro Calculator","Split your daily calories into protein, carbs and fat.",{c:"fit",f:[["k","Daily calories",2200,"cal"],["p","Plan","30,40,30","sel",[["30,40,30","Balanced (30P/40C/30F)"],["40,30,30","High protein (40P/30C/30F)"],["35,25,40","Lower carb (35P/25C/40F)"],["25,5,70","Keto (25P/5C/70F)"]]]],run:v=>{const[p,c,f]=v.p.split(",").map(Number);return{main:["Daily calories",Math.round(v.k)],rows:[["Protein",Math.round(v.k*p/400)+" g ("+p+"%)"],["Carbohydrates",Math.round(v.k*c/400)+" g ("+c+"%)"],["Fat",Math.round(v.k*f/900)+" g ("+f+"%)"]]}}}),
idealweight:T("Ideal Weight Calculator","Compare four common formulas for an ideal body weight.",{c:"fit",f:[SX,["h","Height",68,"inches"]],run:v=>{const o=Math.max(0,v.h-60),M=v.sx=="m",R=[["Devine",(M?50:45.5)+2.3*o],["Robinson",M?52+1.9*o:49+1.7*o],["Miller",M?56.2+1.41*o:53.1+1.36*o],["Hamwi",M?48+2.7*o:45.5+2.2*o]];return{main:["Devine formula",lb(R[0][1])+" lb"],rows:R.slice(1).map(r=>[r[0]+" formula",lb(r[1])+" lb"]),note:"Formulas assume heights of 5 ft or more. Healthy weight varies from person to person."}}}),
pregnancy:T("Pregnancy Calculator","Find your due date and how far along you are from the first day of your last period.",{c:"fit",f:[["l","First day of last period",dm(-70),"date"],["cl","Cycle length",28,"days"]],run:v=>{const L=pd(v.l),due=addD(L,280+(v.cl-28)),d=Math.round((pd(dm(0))-L)/864e5);if(d<0||d>300)return{main:["Due date",fd(due)],rows:[],note:"Choose a period start date within the last 10 months to see your progress."};return{main:["Due date",fd(due)],rows:[["Pregnant now",Math.floor(d/7)+" weeks, "+d%7+" days"],["Trimester",["First","Second","Third"][Math.floor(d/7)<13?0:Math.floor(d/7)<27?1:2]],["Days until due date",Math.max(0,Math.round((due-pd(dm(0)))/864e5))]]}}}),

scientific:T("Scientific Calculator","Type an expression. Supports + - * / ^ ( ) and sin, cos, tan, asin, acos, atan, sqrt, log, ln, exp, abs, pi, e.",{c:"math",f:[["e","Expression","sqrt(16)+2^3*sin(30)","txt"],["g","Angles","1","sel",[[1,"Degrees"],[0,"Radians"]]]],run:v=>{try{const r=sci(v.e,+v.g);if(typeof r!="number")throw 0;return{main:["Result",parseFloat(r.toPrecision(12))],rows:[]}}catch(x){return{err:"Could not read that expression. Check the brackets and function names."}}}}),
fraction:T("Fraction Calculator","Add, subtract, multiply or divide two fractions.",{c:"math",f:[["n1","First numerator",1,"",1],["d1","First denominator",2,"",1],["op","Operation","+","sel",[["+","Add (+)"],["-","Subtract (-)"],["*","Multiply (×)"],["/","Divide (÷)"]]],["n2","Second numerator",1,"",1],["d2","Second denominator",3,"",1]],run:v=>{if(!v.d1||!v.d2)return{err:"Denominators cannot be zero."};let n,d;const{n1,d1,n2,d2,op}=v;if(op=="+"){n=n1*d2+n2*d1;d=d1*d2}else if(op=="-"){n=n1*d2-n2*d1;d=d1*d2}else if(op=="*"){n=n1*n2;d=d1*d2}else{if(!n2)return{err:"Cannot divide by zero."};n=n1*d2;d=d1*n2}const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}const w=Math.trunc(n/d),r=Math.abs(n%d);return{main:["Result",d==1?n:n+"/"+d],rows:[["Mixed number",r&&w?w+" "+r+"/"+d:r?n+"/"+d:w],["Decimal",parseFloat((n/d).toPrecision(10))]]}}}),
percentage:T("Percentage Calculator","Three common percentage questions in one place.",{c:"math",f:[["m","Question",1,"sel",[[1,"What is X% of Y?"],[2,"X is what % of Y?"],[3,"% change from X to Y"]]],["x","X",20,"",1],["y","Y",150,"",1]],run:v=>v.m==1?{main:["Answer",parseFloat((v.x/100*v.y).toPrecision(10))],rows:[]}:v.m==2?(v.y?{main:["Answer",parseFloat((v.x/v.y*100).toPrecision(10))+"%"],rows:[]}:{err:"Y cannot be zero."}):(v.x?{main:["Change",parseFloat(((v.y-v.x)/Math.abs(v.x)*100).toPrecision(10))+"%"],rows:[["Difference",parseFloat((v.y-v.x).toPrecision(10))]]}:{err:"X cannot be zero."})}),
triangle:T("Triangle Calculator","Enter three side lengths to find the area, perimeter, angles and type.",{c:"math",f:[["a","Side a",3,""],["b","Side b",4,""],["c","Side c",5,""]],run:v=>{const{a,b,c}=v;if(!(a>0&&b>0&&c>0)||a+b<=c||a+c<=b||b+c<=a)return{err:"These sides cannot form a triangle."};const s=(a+b+c)/2,A=Math.sqrt(s*(s-a)*(s-b)*(s-c)),ang=(x,y,w)=>Math.acos((y*y+w*w-x*x)/(2*y*w))*180/Math.PI,[X,Y,Q]=[ang(a,b,c),ang(b,a,c),ang(c,a,b)],S=[a,b,c].sort((p,q)=>p-q),r=Math.abs(S[0]**2+S[1]**2-S[2]**2)<1e-9?"right":S[0]**2+S[1]**2>S[2]**2?"acute":"obtuse";return{main:["Area",parseFloat(A.toPrecision(10))],rows:[["Perimeter",parseFloat((2*s).toPrecision(10))],["Angle A",X.toFixed(2)+"°"],["Angle B",Y.toFixed(2)+"°"],["Angle C",Q.toFixed(2)+"°"],["Type",(a==b&&b==c?"equilateral":a==b||b==c||a==c?"isosceles":"scalene")+", "+r]]}}}),
